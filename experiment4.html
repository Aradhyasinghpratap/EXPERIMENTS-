<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms1</title>
</head>
<body>
    <fieldset><h1 align="center">hotel room booking form</h1>
        <form action="" align="center">
         <label for="name">FULL NAME:</label>
         <input type="text" name="name" id="name" placeholder="enter your name">
         <br><br>
         <label for="email">EMAIL:</label>
         <input type="email" name="email" id="email">
         <br><br>
         <label for="phone">CONTACT</label>
         <input type="tel" name="phone" id="phone">
         <br><br>
         <label for="date">CHECK IN DATE</label>
         <input for="date" name="date" id="date">
         <br><br>
         <label for="date">CHECK OUT DATE</label>
         <input type="date" name="date" id="date">
         <br><br>
         <label for="room">ROOM TYPE</label>
         <select name="room type" id="room type">
            <option value="."></option>
            <option value="delux">deluxe</option>
            <option value="premium">premium</option>
            <option value="single">single</option>
            <option value="double"></option>
         </select>
         <br><br>
         <label for="">SEPCIAL REQUEST</label>
         <textarea name="add" id="add"></textarea>
         <BR><BR>
            <input type="submit" value="book now">&nbsp;
            <input type="reset" value="request form">
        </form>
    </fieldset>
</body>
</html>
