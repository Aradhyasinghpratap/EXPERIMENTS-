<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms2</title>
</head>
<body><H1 align="center">STUDENT REGISTRATION FORM</H1>
    <fieldset>
        <form action="#">
            <label for="name">FULL NAME</label>
            <input type="text" name="name" id="name" mimlength="5" maxlength="10">
            <br><br>
            <label for="email">EMAIL</label>
            <input type="email" name="email" id="email" placeholder="enter your email">
            <br><br>
            <label for="password">PASSWORD</label>
            <input type="password" name="pass" id="name" placeholder="enter your password">
            <br><br>
            <label for="gender">GENDER</label>
            <input type="radio" name="gender" id="gender">
            <label for="gender">MALE</label>
            <input type="radio" name="gender" id="gender">
            <label for="gender">FEMALE</label>
            <input type="radio" name="gender" id="gender">
            <label for="gender">OTHER</label>
             <BR><BR>
            <label for="course">SELECT COURSE</label>
            <select name="coure" id="course">
                <option value="."></option>
                <option value="btech">BTECH</option>
                <option value="ba">BA</option>
                <option value="ma">MA</option>
            </select>  
            <br><br>
            <label for="phone">CONTACT NO.:</label>
            <input type="tel" name="phone" id="phone" min="1" max="10">
            <br><br>
            <label for="add">ADDRESS</label>
            <textarea name="add" id="add" placeholder="enetr your address"></textarea>
            <br><br>
            <input type="submit" value="register">&nbsp;
            <input type="reset" value="clear">
        </form>
    </fieldset>
</body>
</html>
